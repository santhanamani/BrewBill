[project]
name = "brewbill-api"
version = "0.1.0"
description = "BrewBill POS cloud sync and subscription API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "passlib[argon2]>=1.7.4",
  "PyJWT>=2.10",
  "cryptography>=44.0",
  "python-multipart>=0.0.20",
  "Pillow>=12.3,<13",
  "httpx>=0.28",
  "pytest>=8.3"
]

[project.scripts]
brewbill-seed = "app.seed:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uvicorn]
factory = false
